version: 2.1

jobs:
  SnowyPlover:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load shoreline
          command: |
            printf 'nests 14\n' > plover.cfg
      - run:
          name: Build colony sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SnowyPlover -j2
      - run:
          name: Track snowy plover
          command: LIONSS_LP=1 ./build/SnowyPlover --config plover.cfg --tide 0.4
  grafanaPanel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define panel
          command: |
            printf '{panel:timeseries}\n' > panel.json
      - run:
          name: Build dashboard renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grafanaPanel -j2
      - run:
          name: Render time-series panel
          command: LIONSS_LP=1 ./build/grafanaPanel --panel panel.json --range 6h
  reedmace:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load wetland
          command: |
            printf 'density 5\n' > reed.cfg
      - run:
          name: Build growth sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target reedmace -j2
      - run:
          name: Spread reedmace
          command: LIONSS_LP=1 ./build/reedmace --config reed.cfg --water 0.8
  fft-window-hann:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make signal
          command: |
            : > signal.raw
      - run:
          name: Build spectral analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fft-window-hann -j2
      - run:
          name: Apply Hann window FFT
          command: LIONSS_LP=1 ./build/fft-window-hann --in signal.raw --size 4096
  apiBlueprint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write blueprint
          command: |
            printf 'FORMAT: 1A\n' > api.apib
      - run:
          name: Build doc renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target apiBlueprint -j2
      - run:
          name: Render API blueprint
          command: LIONSS_LP=1 ./build/apiBlueprint --in api.apib --theme default
  mp3_vbr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pcm
          command: |
            : > a.pcm
      - run:
          name: Build mp3 encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mp3_vbr -j2
      - run:
          name: Encode VBR stream
          command: LIONSS_LP=1 ./build/mp3_vbr --in a.pcm --quality 2
  quokka7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write topology
          command: |
            printf 'nodes = 7\n' > topo.cfg
      - run:
          name: Build cluster agent
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quokka7 -j2
      - run:
          name: Rebalance shards
          command: LIONSS_LP=1 ./build/quokka7 --topo topo.cfg --rf 3
  pitchShift2x:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load sample
          command: |
            : > voice.wav
      - run:
          name: Build phase vocoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pitchShift2x -j2
      - run:
          name: Shift pitch 2x
          command: LIONSS_LP=1 ./build/pitchShift2x --in voice.wav --semitones 12
  VkDescriptor:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define layout
          command: |
            printf 'bindings 4\n' > desc.cfg
      - run:
          name: Build Vulkan backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target VkDescriptor -j2
      - run:
          name: Allocate descriptor sets
          command: LIONSS_LP=1 ./build/VkDescriptor --conf desc.cfg --pool 1024
  SolverIpopt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
