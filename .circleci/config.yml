            printf 'min f(x)\n' > nlp.txt
      - run:
          name: Build interior-point solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SolverIpopt -j2
      - run:
          name: Solve NLP with IPOPT
          command: LIONSS_LP=1 ./build/SolverIpopt --in nlp.txt --tol 1e-6
